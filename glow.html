<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seltzer Hero — Glow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #controls {
      position: fixed;
      top: 1em;
      left: 1em;
      display: grid;
      grid-template-columns: repeat(3, auto);
      align-items: center;
      gap: 0.5em 1em;
      padding: 1em;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
    }

    #graph {
      grid-column: 1 / -1;
      width: 320px;
      height: 160px;
    }

    #config {
      grid-column: 1 / -1;
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
      background: #111;
      color: #fff;
      border: 1px solid #333;
      resize: none;
    }

    #copy {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <label for="width">width</label>
    <input id="width" type="range" min="1" max="1000" step="1">
    <span id="widthValue"></span>

    <label for="height">height</label>
    <input id="height" type="range" min="1" max="1000" step="1">
    <span id="heightValue"></span>

    <label for="mid">mid</label>
    <input id="mid" type="range" min="1" max="400" step="1">
    <span id="midValue"></span>

    <label for="steepness">steepness</label>
    <input id="steepness" type="range" min="0.5" max="20" step="0.1">
    <span id="steepnessValue"></span>

    <label for="bg">bg</label>
    <input id="bg" type="color">
    <span id="bgValue"></span>

    <label for="stroke">stroke</label>
    <input id="stroke" type="color">
    <span id="strokeValue"></span>

    <label for="secondary">secondary</label>
    <input id="secondary" type="color">
    <span id="secondaryValue"></span>

    <canvas id="graph"></canvas>

    <textarea id="config" rows="10" readonly></textarea>
    <button id="copy">copy config</button>
  </div>

  <script type="module" src="glow.js"></script>
</body>
</html>
