<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seltzer Hero — Riff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1em;
      min-height: 100vh;
      margin: 0;
    }

    #notes {
      display: grid;
      grid-template-columns: repeat(3, auto);
      align-items: center;
      gap: 0.5em 1em;
    }
  </style>
</head>
<body>
  <button id="start">start</button>
  <label>
    bpm
    <input id="bpm" type="range" min="40" max="300" step="1" value="120">
    <span id="bpmValue"></span>
  </label>
  <label>
    volume
    <input id="volume" type="range" min="0" max="10" step="0.01" value="3.6">
    <span id="volumeValue"></span>
  </label>
  <label>
    note length
    <input id="noteLength" type="range" min="0.1" max="1" step="0.01" value="0.95">
    <span id="noteLengthValue"></span>
  </label>
  <div id="notes"></div>

  <script type="module" src="riff.js"></script>
</body>
</html>
